# =============================================================================
#  Grow Through Chess - site settings
#  Texts of the pages are NOT here: they live in the "content" folder.
#  Email, address and social links live in data/contact.yaml.
# =============================================================================

baseURL = "https://growthroughchess.com/"
title = "Grow Through Chess"
defaultContentLanguage = "nl"
defaultContentLanguageInSubdir = false

# Generate a robots.txt that points search engines to the sitemap.
enableRobotsTXT = true

# Use the date of the last git commit as "last modified" date in the sitemap.
enableGitInfo = true

# Page types this site does not use (tags, categories, RSS feeds).
disableKinds = ["taxonomy", "term", "rss"]

[params]
  # Optional Google Analytics measurement ID, e.g. "G-XXXXXXXXXX".
  google_analytics_id = ""

  # Image shown when a page is shared on Facebook, WhatsApp, ...
  # Best size: 1200 x 630 pixels.
  # (a page can override it with "socialImage" in its front matter).
  socialImage = "images/share-image.jpg"

  [params.logo]
    image = "images/Logo_CL.png"
    width = 110
    height = 66
    alt = "Grow Through Chess"

[languages]
  [languages.nl]
    label = "Nederlands"
    locale = "nl-BE"
    weight = 1
    [languages.nl.params]
      # Default text shown by Google when a page has no "description" of its own.
      description = "Schaaklessen in Leuven voor kinderen, jongeren en volwassenen. Gestructureerde lessen in kleine groepen, van beginners tot gevorderden."

    [[languages.nl.menu.main]]
      name = "Schaaklessen"
      pageRef = "/schaaklessen"
      weight = 1
    [[languages.nl.menu.main]]
      name = "Over ons"
      pageRef = "/about"
      weight = 2
    [[languages.nl.menu.main]]
      name = "Inschrijven"
      pageRef = "/inschrijven"
      weight = 3
    [[languages.nl.menu.main]]
      name = "Kalender"
      pageRef = "/kalender"
      weight = 4
    [[languages.nl.menu.main]]
      name = "Contact"
      pageRef = "/contact"
      weight = 5

  [languages.en]
    label = "English"
    locale = "en-GB"
    weight = 2
    [languages.en.params]
      description = "Chess lessons in Leuven for children, teenagers and adults. Structured lessons in small groups, from beginners to advanced players."

    [[languages.en.menu.main]]
      name = "Chess Lessons"
      pageRef = "/schaaklessen"
      weight = 1
    [[languages.en.menu.main]]
      name = "About Us"
      pageRef = "/about"
      weight = 2
    [[languages.en.menu.main]]
      name = "Sign Up"
      pageRef = "/inschrijven"
      weight = 3
    [[languages.en.menu.main]]
      name = "Calendar"
      pageRef = "/kalender"
      weight = 4
    [[languages.en.menu.main]]
      name = "Contact"
      pageRef = "/contact"
      weight = 5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Allows plain HTML inside the markdown texts.
      unsafe = true

[imaging]
  quality = 82
